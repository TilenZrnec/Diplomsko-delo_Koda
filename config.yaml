# =============================================================================
# Edini vir parametrov eksperimenta.
#
# Vsi skripti (lokalni pilot, SLURM polje na Arnesu, predpriprava, profiliranje)
# berejo to datoteko prek src/config.py. Nikjer drugje v kodi ni trdo zapisanega
# semena, števila foldov ali seznama algoritmov - če hočeš spremeniti protokol,
# spremeniš tukaj in sprememba velja povsod hkrati.
# =============================================================================

# Naključno seme: delitve na folde in vsak model (random_state).
random_state: 42

# Prečno preverjanje: n_splits foldov, n_repeats ponovitev z različnim mešanjem.
# n_repeats = 1 pomeni navaden StratifiedKFold; > 1 pomeni RepeatedStratifiedKFold,
# kjer je indeks folda v rezultatih enak ponovitev * n_splits + k. Model v
# ponovitvi r dobi seme random_state + r (42, 43, 44), da ponovitve zajamejo tudi
# naključnost modela, ne le delitve. 3 ponovitve = 15 učenj na (nabor, algoritem).
n_splits: 5
n_repeats: 3

# Algoritmi, ki se poženejo (imena so ključi v src/models/__init__.py REGISTRY).
# Vrstni red tu je tudi vrstni red izvajanja.
algorithms:
  - random_forest
  - xgboost
  - lightgbm
  - catboost
  - tabpfn
  - tabicl

# Poimenovani nabori podatkovnih množic. Vsaka datoteka je JSON seznam; element je
# bodisi celo število (OpenML ID) bodisi objekt {"source": "csv", ...} za lokalno
# datoteko (glej src/data.py). Na zagon izbereš enega z --dataset-set <ime>.
dataset_sets:
  subset: scripts/subset_ids.json     # pilotna trojica 31/37/38
  cc18: scripts/cc18_ids.json         # celotna zbirka OpenML-CC18 (72 naborov)
  medic3: scripts/medic3.json         # zaupni lokalni nabor (ni v gitu, glej data.py)
  # Ista datoteka, omejena na 160 najpogostejših razredov (ključ max_classes).
  # Surovi Medic3 ima 220 razredov; tako TabPFN-3 kot TabPFN-3.5 imata trdo mejo
  # 160 razredov (TabPFN-3.5 izmerjeno 2026-10-06: 160 uspe, 161 in 220 odpovesta).
  # Ta različica je zato edina, kjer je primerjava vseh šestih mogoča (mentorjeva
  # omejena različica, načrt 2026-08-12).
  medic3_160: scripts/medic3_160.json
  # Poskus uglaševanja XGBoost (2026-10-14): CC18 brez štirih velikih slikovnih
  # naborov (68), najprej 36 nenasičenih (indeksi 0-35), nato 32 nasičenih
  # (36-67). Pripeto s scripts/gen_tuning_ids.py iz cc18_v4/combined.
  cc18_tuning: scripts/cc18_tuning_ids.json

# Kam OpenML shrani prenesene nabore (relativno na koren repozitorija).
cache_dir: data/openml_cache

# Koren map z zagoni: vsak zagon dobi svojo mapo results/runs/<run_id>/ z
# manifest.json, per_dataset/, predictions/ in results.csv. Nič se ne prepisuje.
results_dir: results/runs

# Ali naj vsako učenje shrani napovedane verjetnosti (predict_proba) v
# predictions/<nabor>/<algoritem>_r<ponovitev>_f<fold>.npz. Omogoča, da se
# pozneje izračuna poljubna metrika brez ponovnega zagona.
save_predictions: true

# Analiza (src/summary.py, src/stats.py):
# nabor je "nasičen", če najboljši algoritem doseže vsaj ta ROC-AUC - tam razlike
# med algoritmi niso informativne, zato se povzetek poroča tudi brez njih.
saturation_threshold: 0.995
# Stopnja značilnosti za Friedmanov test, Nemenyijev post-hoc in Wilcoxon-Holm.
alpha: 0.05

# Uglaševanje hiperparametrov - le za algoritem xgboost_tuned (src/models/xgboost_tuned.py).
# Iskanje po mreži z gnezdenim prečnim preverjanjem: zunanji foldi so isti kot pri
# vseh algoritmih (zgoraj), na učnem delu vsakega folda pa inner_splits-kratno
# stratificirano prečno preverjanje izbere nastavitev z najboljšim povprečnim
# ROC-AUC; ta se nato nauči na celem učnem delu in se enkrat oceni na testnem.
# Katere nastavitve in razponi: Probst, Boulesteix in Bischl (2019), JMLR 20(53),
# tabela 3 (najbolj "uglasljivi" parametri XGBoost; max_depth najmanj, zato ga ne
# uglašujemo). Pri vsakem parametru je PRVA vrednost privzeta vrednost XGBoost, zato
# je privzeta nastavitev ena od točk mreže in ob izenačenju zmaga (vrstni red mreže).
# n_estimators ne zahteva novih učenj: model se nauči do največje vrednosti, manjše
# se preberejo z iteration_range (preverjeno 2026-10-13: enake napovedi).
# learning_rate 0.01 dodan 2026-10-15 po pilotu (subset, prva mreža z 0.03 kot
# najmanjšo): pri 32 od 45 zunanjih foldov je zmagal spodnji kot mreže (0.03, 100
# dreves), na diabetes je notranji rezultat padal z vsakim korakom učenja - optimum
# je bil pod mrežo. Z 0.01 je najboljše število dreves v 12 od 15 preverjenih foldov
# znotraj mreže (200-500). 0.01 je v Probstovem razponu (0.002-0.355) in z 0.03
# objame njihovo optimalno privzeto vrednost 0.018. Mreža: 4 x 2 x 2 x 2 x 4 = 128.
tuning:
  inner_splits: 3
  n_estimators: [100, 200, 500, 1000]
  grid:
    learning_rate: [0.3, 0.1, 0.03, 0.01]
    min_child_weight: [1, 4]
    colsample_bylevel: [1.0, 0.5]
    subsample: [1.0, 0.8]
